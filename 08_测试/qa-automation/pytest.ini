[pytest]
testpaths = testcases
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --tb=short --alluredir=reports/allure-results --clean-alluredir
markers =
    l1: 单元测试（纯函数，不碰 DB/HTTP）
    l2: 接口集成测试（真实 HTTP）
    l3: 中间件集成测试（连已启动的 MySQL/Redis 容器）
    l4: 端到端主路径
    p0: P0 主路径用例
    perf: 性能相关
    m1: 基线指标 M1 画布复杂度
    m2: 基线指标 M2 并发执行
    m3: 基线指标 M3 API 节点重试
    m6: 基线指标 M6 MQTT 延迟
    m7: 基线指标 M7 多租户隔离
    m8: 基线指标 M8 角色权限
