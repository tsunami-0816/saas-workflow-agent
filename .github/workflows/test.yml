name: test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  collect:
    name: pytest 收集（语法/用例可发现性）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 08_测试/qa-automation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装测试依赖
        run: |
          python -m pip install --upgrade pip
          pip install pytest==8.3.3 PyYAML==6.0.2 httpx==0.28.1
      - name: 用例收集（不连数据库/不依赖服务）
        run: pytest --collect-only -q
